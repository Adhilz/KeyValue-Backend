[project]
name = "myproject"
version = "0.1.0"

dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.30.0",
    "fastapi==0.136.3",
    "pydantic>=2.13.4",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.48.0",
    "bcrypt>=5.0.0",
    "python-jose[cryptography]>=3.5.0",
    "greenlet>=3.5.1",
    "python-multipart>=0.0.30",
    "psycopg2-binary>=2.9.12",
]

[dependency-groups]
dev = [
    "poethepoet>=0.46.0",
    "pytest>=9.0.3",
    "pytest-cov>=5.0.0",
    "httpx>0.27.0",
    "pytest-asyncio>=1.4.0",
    "aiosqlite>=0.22.1",
]
[tool.pytest.ini_options]
testpaths      = ["tests"]
           # only walk tests/, not the whole repo
python_files   = ["test_*.py"]
        # files pytest treats as test files
python_classes = ["Test*"]
            # class names that group tests
python_functions = ["test_*"]
